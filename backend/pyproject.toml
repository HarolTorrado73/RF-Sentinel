name="sentinelrecon-backend"
version="0.1.0"
description="Next-Generation Security Reconnaissance Platform - Backend"
authors=["SentinelRecon Team"]
license="MIT"
requires-python=">=3.12"
dependencies=[
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.19",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "python-nmap>=0.7.0",
    "reportlab>=4.2.0",
    "pandas>=2.2.0",
    "python-socketio>=5.11.0",
    "psutil>=6.1.0",
    "structlog>=24.5.0",
]

[project.optional-dependencies]
dev=[
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.0",
    "black>=25.0.0",
    "mypy>=1.15.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",
]